<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stakeholder Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">💧 Smart Water</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
        <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
        <li class="nav-item"><a class="nav-link" href="stations.html">Stations</a></li>
        <li class="nav-item"><a class="nav-link" href="alerts.html">Alerts</a></li>
        <li class="nav-item"><a class="nav-link" href="weather.html">Weather Dashboard</a></li>
      </ul>
    </div>
  </div>
</nav>
<main class="flex-grow-1 d-flex align-items-center py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-7 col-lg-5">
        <div class="card border-0 shadow-sm">
          <div class="card-body p-4 p-md-5">
            <h1 class="h2 fw-bold mb-4">Stakeholder Login</h1>
            <form id="loginForm" class="row g-3">
              <div class="col-12">
                <label for="loginEmail" class="form-label fw-semibold">Email</label>
                <input id="loginEmail" name="loginEmail" class="form-control" type="email" required maxlength="100" placeholder="Enter email">
              </div>
              <div class="col-12">
                <label for="loginPassword" class="form-label fw-semibold">Password</label>
                <input id="loginPassword" name="loginPassword" class="form-control" type="password" required minlength="8" maxlength="30" placeholder="Enter password">
              </div>
              <div class="col-12">
                <button class="btn btn-primary w-100" type="submit">Login</button>
              </div>
            </form>
            <div id="loginMsg" class="mt-3" aria-live="polite"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
<footer class="bg-dark text-white text-center py-4 mt-auto">
  <div class="container">
    <p class="mb-0">Smart Water Quality Monitoring and Conservation Network</p>
  </div>
</footer>
<script src="js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
