<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stakeholder Registration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">💧 Smart Water</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
        <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
        <li class="nav-item"><a class="nav-link" href="stations.html">Stations</a></li>
        <li class="nav-item"><a class="nav-link" href="alerts.html">Alerts</a></li>
        <li class="nav-item"><a class="nav-link" href="weather.html">Weather Dashboard</a></li>
      </ul>
    </div>
  </div>
</nav>
<main class="flex-grow-1 d-flex align-items-center py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-9 col-lg-6">
        <div class="card border-0 shadow-sm">
          <div class="card-body p-4 p-md-5">
            <h1 class="h2 fw-bold mb-4">Stakeholder Registration</h1>
            <form id="registerForm" class="row g-3">
              <div class="col-12">
                <label for="name" class="form-label fw-semibold">Full Name</label>
                <input id="name" name="name" class="form-control" required minlength="3" maxlength="50" pattern="[A-Za-z][A-Za-z .'-]{2,49}" placeholder="Enter name">
              </div>
              <div class="col-12">
                <label for="email" class="form-label fw-semibold">Email</label>
                <input id="email" name="email" class="form-control" type="email" required maxlength="100" placeholder="Enter email">
              </div>
              <div class="col-12">
                <label for="role" class="form-label fw-semibold">Role</label>
                <select id="role" name="role" class="form-select" required>
                  <option value="">Select role</option>
                  <option>Water Quality Officer</option>
                  <option>Station Operator</option>
                  <option>Environmental Officer</option>
                  <option>Administrator</option>
                </select>
              </div>
              <div class="col-12">
                <label for="password" class="form-label fw-semibold">Password</label>
                <input id="password" name="password" class="form-control" type="password" required minlength="8" maxlength="30" placeholder="Create password">
              </div>
              <div class="col-12">
                <label for="confirmPassword" class="form-label fw-semibold">Confirm Password</label>
                <input id="confirmPassword" name="confirmPassword" class="form-control" type="password" required minlength="8" maxlength="30" placeholder="Re-enter password">
              </div>
              <div class="col-12">
                <div class="form-check">
                  <input id="terms" name="terms" class="form-check-input" type="checkbox" required>
                  <label class="form-check-label" for="terms">I confirm that the information provided is correct.</label>
                </div>
              </div>
              <div class="col-12">
                <button class="btn btn-primary w-100" type="submit">Register</button>
              </div>
            </form>
            <div id="msg" class="mt-3" aria-live="polite"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
<footer class="bg-dark text-white text-center py-4 mt-auto">
  <div class="container">
    <p class="mb-0">Smart Water Quality Monitoring and Conservation Network</p>
  </div>
</footer>
<script src="js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
